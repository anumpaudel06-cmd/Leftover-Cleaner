name: Build Windows Standalone Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package Standalone Windows EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Safety Engine Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Compile Standalone Executable with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --clean `
            --name="Leftover-Cleaner" `
            --manifest="app.manifest" `
            --add-data="src;src" `
            --collect-all="customtkinter" `
            src/main.py

      - name: Verify Executable Creation
        run: |
          if (Test-Path "dist/Leftover-Cleaner.exe") {
            Write-Host "Build verified: dist/Leftover-Cleaner.exe exists."
            Get-Item "dist/Leftover-Cleaner.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Error "dist/Leftover-Cleaner.exe was not created."
            exit 1
          }

      - name: Upload Build Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: Leftover-Cleaner-Windows-x64
          path: dist/Leftover-Cleaner.exe
          retention-days: 90

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Leftover-Cleaner v1.0.0 (Production Release)"
          draft: false
          prerelease: false
          files: dist/Leftover-Cleaner.exe
          body: |
            ### Leftover-Cleaner v1.0.0 🛡️
            
            **The safe, surgical Windows 10/11 utility for orphan folders, residual registry keys, and system junk.**
            
            #### 📦 Download Assets:
            - **`Leftover-Cleaner.exe`** (Single standalone executable with embedded UAC Administrator manifest and PerMonitorV2 High-DPI support).
            
            #### 🚀 Highlights:
            - **Self-Elevation**: Automatically requests Administrator rights via Windows UAC (`runas`).
            - **Orphan Directory Cleaner**: Cross-references 32-bit and 64-bit Uninstall registry hives.
            - **Safe Registry Cleaner**: Cleans residual vendor keys, dead MUI Cache paths, and orphaned startup items.
            - **Anti-Corruption Guardrails**: Strict immunity for `System32`, `WinSxS`, `Drivers`, and `HKLM\Software\Microsoft`.
            - **Automated Restore Points & .REG Backups**: Snapshots system state before any deletion.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
